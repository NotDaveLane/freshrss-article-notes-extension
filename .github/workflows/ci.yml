# The full suite (bin/ci --all-dbs) on every supported FreshRSS line: the same matrix as `bin/ci --compat`, one job per
# version so they run in parallel. Keep `matrix.freshrss` in step with COMPAT_VERSIONS in bin/ci.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FreshRSS ${{ matrix.freshrss }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default version (docker-compose.yml) also lints; FreshRSS's APIs and coding standard differ between lines.
          - freshrss: 1.30.1
            ci-args: --all-dbs
          - freshrss: 1.27.1
            ci-args: --all-dbs --no-lint
    env:
      FRESHRSS_VERSION: ${{ matrix.freshrss }}
    steps:
      - uses: actions/checkout@v5

      - name: Start the dev stack
        run: docker compose up --build -d --wait

      - name: bin/ci ${{ matrix.ci-args }}
        run: bin/ci ${{ matrix.ci-args }}

      - name: FreshRSS log
        if: failure()
        run: docker compose logs --no-color freshrss

      - name: Upload coverage and Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-freshrss-${{ matrix.freshrss }}
          path: |
            coverage/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose --profile tools --profile db-matrix down -v --remove-orphans
