services:
  freshrss:
    build:
      context: .
      target: runtime
      args:
        FRESHRSS_VERSION: ${FRESHRSS_VERSION:-1.30.1}
    ports:
      - "${FRESHRSS_PORT:-8080}:80"
    volumes:
      - ./xExtension-ArticleNotes:/var/www/FreshRSS/extensions/xExtension-ArticleNotes
      - freshrss-data:/var/www/FreshRSS/data
    environment:
      TZ: UTC
      CRON_MIN: "3,33"
      DEV_USER: ${FRESHRSS_DEV_USER:-admin}
      FRESHRSS_ENV: development
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url http://localhost:${FRESHRSS_PORT:-8080}
        --db-type sqlite
        --default-user ${FRESHRSS_DEV_USER:-admin}
        --language en
      FRESHRSS_USER: |-
        --user ${FRESHRSS_DEV_USER:-admin}
        --password ${FRESHRSS_DEV_PASSWORD:-freshrss-dev-password}
        --api-password ${FRESHRSS_DEV_API_PASSWORD:-freshrss-dev-api}
        --language en
        --no-default-feeds
    depends_on:
      fixtures:
        condition: service_healthy
    restart: unless-stopped

  fixtures:
    image: nginx:alpine
    volumes:
      - ./tests/fixtures/feeds:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/feed.xml"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- Tooling (not started by `up`; run with `docker compose run --rm dev ...`, see bin/) ---

  dev:
    profiles: [tools]
    build:
      context: .
      target: dev
      args:
        FRESHRSS_VERSION: ${FRESHRSS_VERSION:-1.30.1}
    image: freshrss-article-notes-dev:${FRESHRSS_VERSION:-1.30.1}
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      # Selects the database engine for the integration tests: sqlite (default), mariadb, postgres.
      TEST_DB: ${TEST_DB:-sqlite}
    command: ["true"]

  e2e:
    profiles: [tools]
    # Keep the image tag in lockstep with @playwright/test in tests/e2e/package.json.
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    working_dir: /e2e
    ipc: host
    volumes:
      - ./tests/e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    environment:
      BASE_URL: http://freshrss
      FRESHRSS_DEV_USER: ${FRESHRSS_DEV_USER:-admin}
      FRESHRSS_DEV_PASSWORD: ${FRESHRSS_DEV_PASSWORD:-freshrss-dev-password}
    command: ["true"]

  # --- Database matrix (profile db-matrix): integration tests against other engines ---

  mariadb:
    profiles: [db-matrix]
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: freshrss_test
      MARIADB_USER: freshrss
      MARIADB_PASSWORD: freshrss
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40
    tmpfs:
      - /var/lib/mysql

  postgres:
    profiles: [db-matrix]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freshrss_test
      POSTGRES_USER: freshrss
      POSTGRES_PASSWORD: freshrss
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshrss -d freshrss_test"]
      interval: 3s
      timeout: 5s
      retries: 40
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  freshrss-data:
  e2e-node-modules:
